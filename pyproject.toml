[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "turkishevalkit"
version = "1.0.0"
description = "Human-in-the-loop Turkish AI evaluation workbench with portable datasets, rebuildable metadata indexing, reliability, review queues, calibration, and audio QA."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "BLCCoreStudio" }]
keywords = [
  "ai-evaluation",
  "turkish",
  "llm",
  "audio-quality",
  "human-in-the-loop",
  "calibration",
  "jsonl",
  "inter-rater-reliability",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BLCCoreStudio/TurkishEvalKit"
Repository = "https://github.com/BLCCoreStudio/TurkishEvalKit"
Issues = "https://github.com/BLCCoreStudio/TurkishEvalKit/issues"
Changelog = "https://github.com/BLCCoreStudio/TurkishEvalKit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
workbench = [
  "flask>=3.1,<4",
]
dev = [
  "flask>=3.1,<4",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
turkisheval = "turkishevalkit.cli:main"
turkisheval-queue = "turkishevalkit.review_queue_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turkishevalkit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["turkishevalkit"]
