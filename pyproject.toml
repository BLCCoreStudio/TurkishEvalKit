[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "turkishevalkit"
version = "0.7.0"
description = "Human-in-the-loop Turkish AI evaluation workbench with immutable review revisions, calibration, audio QA, and local history."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "BLCCoreStudio" }]
keywords = ["ai-evaluation", "turkish", "llm", "audio-quality", "human-in-the-loop", "calibration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
workbench = [
  "flask>=3.1,<4",
]
dev = [
  "flask>=3.1,<4",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
turkisheval = "turkishevalkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turkishevalkit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["turkishevalkit"]
