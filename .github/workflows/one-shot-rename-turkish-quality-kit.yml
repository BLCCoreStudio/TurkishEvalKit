name: One-shot TurkishQualityKit rename

on:
  push:
    branches:
      - rename/turkish-quality-kit
    paths:
      - .github/workflows/one-shot-rename-turkish-quality-kit.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout rename branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: rename/turkish-quality-kit
          fetch-depth: 0

      - name: Rename package paths and brand tokens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          OLD_DIR = "turkishevalkit"
          NEW_DIR = "turkishqualitykit"
          REPLACEMENTS = (
              ("TURKISHEVALKIT", "TURKISHQUALITYKIT"),
              ("TurkishEvalKit", "TurkishQualityKit"),
              ("turkishevalkit", "turkishqualitykit"),
              ("TURKISHEVAL", "TURKISHQUALITY"),
              ("turkisheval", "turkishquality"),
          )
          REPO_SLUGS = (
              "https://github.com/BLCCoreStudio/TurkishEvalKit",
              "github.com/BLCCoreStudio/TurkishEvalKit",
          )

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [path for path in tracked if path]

          # Rename tracked paths first so imports, package data and build metadata can
          # be updated without leaving a duplicate package tree behind.
          for old_path in sorted(tracked, key=len, reverse=True):
              if OLD_DIR not in old_path:
                  continue
              new_path = old_path.replace(OLD_DIR, NEW_DIR)
              Path(new_path).parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", old_path, new_path], check=True)

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [path for path in tracked if path]
          changed_files = []
          replacement_count = 0

          for raw_path in tracked:
              path = Path(raw_path)
              if path.name == "one-shot-rename-turkish-quality-kit.yml":
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              # Keep the public repository slug stable while the submitted job
              # application still references it. The product/package/CLI branding
              # is renamed in this branch; repository cutover happens separately.
              protected = {}
              for index, slug in enumerate(REPO_SLUGS):
                  token = f"__BLC_REPO_SLUG_{index}__"
                  if slug in text:
                      text = text.replace(slug, token)
                      protected[token] = slug

              updated = text
              for old, new in REPLACEMENTS:
                  count = updated.count(old)
                  if count:
                      replacement_count += count
                      updated = updated.replace(old, new)

              for token, slug in protected.items():
                  updated = updated.replace(token, slug)

              if updated != text:
                  # `text` currently contains protected placeholders, so compare
                  # against the actual original content instead.
                  pass
              original = data.decode("utf-8")
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed_files.append(raw_path)

          plan = Path("docs/RENAME_TO_TURKISH_QUALITY_KIT.md")
          plan.write_text(
              """# TurkishQualityKit rename staging\n\n"
              "This branch stages the public product rename from **TurkishEvalKit** to "
              "**TurkishQualityKit** without changing the GitHub repository slug yet.\n\n"
              "## Staged names\n\n"
              "- Product: `TurkishQualityKit`\n"
              "- Python distribution/package: `turkishqualitykit`\n"
              "- CLI: `turkishquality`\n"
              "- Environment/constant prefix where applicable: `TURKISHQUALITY` / `TURKISHQUALITYKIT`\n\n"
              "## Deliberately unchanged for now\n\n"
              "The repository remains `BLCCoreStudio/TurkishEvalKit` while an external job "
              "application is under review and references that public URL. Repository rename "
              "and URL cleanup should be done only at the final cutover.\n\n"
              "This branch is not the default branch and is not intended to be merged until "
              "the external application-name consistency concern is no longer relevant.\n"
              """,
              encoding="utf-8",
          )
          subprocess.run(["git", "add", "docs/RENAME_TO_TURKISH_QUALITY_KIT.md"], check=True)

          print(f"Updated {len(changed_files)} tracked text files with {replacement_count} replacements.")
          PY

      - name: Verify package and CLI rename surface
        shell: bash
        run: |
          set -euo pipefail
          test -d src/turkishqualitykit
          test ! -e src/turkishevalkit
          grep -q 'turkishqualitykit' pyproject.toml
          grep -q 'turkishquality' pyproject.toml
          ! grep -R --line-number --exclude='RENAME_TO_TURKISH_QUALITY_KIT.md' --exclude='one-shot-rename-turkish-quality-kit.yml' \
            -E 'TurkishEvalKit|turkishevalkit|turkisheval' src tests examples docs .github pyproject.toml README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SUPPORT.md 2>/dev/null

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Run lint and type checks
        run: |
          ruff check .
          mypy src

      - name: Commit staged rename and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/one-shot-rename-turkish-quality-kit.yml
          git commit -m "refactor: stage TurkishQualityKit rename"
          git push origin HEAD:rename/turkish-quality-kit
