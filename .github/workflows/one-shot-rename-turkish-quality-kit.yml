name: One-shot TurkishQualityKit rename

on:
  push:
    branches:
      - rename/turkish-quality-kit
    paths:
      - .github/workflows/one-shot-rename-turkish-quality-kit.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout rename branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: rename/turkish-quality-kit
          fetch-depth: 0

      - name: Rename package paths and brand tokens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          OLD_DIR = "turkishevalkit"
          NEW_DIR = "turkishqualitykit"
          REPLACEMENTS = (
              ("TURKISHEVALKIT", "TURKISHQUALITYKIT"),
              ("TurkishEvalKit", "TurkishQualityKit"),
              ("turkishevalkit", "turkishqualitykit"),
              ("TURKISHEVAL", "TURKISHQUALITY"),
              ("turkisheval", "turkishquality"),
          )
          REPO_SLUGS = (
              "https://github.com/BLCCoreStudio/TurkishEvalKit",
              "github.com/BLCCoreStudio/TurkishEvalKit",
          )

          tracked = [p for p in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0") if p]
          for old_path in sorted(tracked, key=len, reverse=True):
              if OLD_DIR not in old_path:
                  continue
              new_path = old_path.replace(OLD_DIR, NEW_DIR)
              Path(new_path).parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", old_path, new_path], check=True)

          tracked = [p for p in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0") if p]
          replacement_count = 0
          changed_files = 0
          for raw_path in tracked:
              path = Path(raw_path)
              if path.name == "one-shot-rename-turkish-quality-kit.yml":
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  original = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              text = original
              protected = {}
              for index, slug in enumerate(REPO_SLUGS):
                  token = f"__BLC_REPO_SLUG_{index}__"
                  if slug in text:
                      text = text.replace(slug, token)
                      protected[token] = slug

              updated = text
              for old, new in REPLACEMENTS:
                  replacement_count += updated.count(old)
                  updated = updated.replace(old, new)
              for token, slug in protected.items():
                  updated = updated.replace(token, slug)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed_files += 1

          Path("docs/RENAME_TO_TURKISH_QUALITY_KIT.md").write_text(
              "# TurkishQualityKit rename staging\n\n"
              "This branch stages the product rename from **TurkishEvalKit** to **TurkishQualityKit**.\n\n"
              "- Product: `TurkishQualityKit`\n"
              "- Python distribution/package: `turkishqualitykit`\n"
              "- CLI: `turkishquality` and `turkishquality-queue`\n"
              "- Internal prefix where applicable: `TURKISHQUALITY` / `TURKISHQUALITYKIT`\n\n"
              "The public repository slug intentionally remains `BLCCoreStudio/TurkishEvalKit` for now because the submitted job application references that URL. The repository itself must not be renamed until the final cutover.\n",
              encoding="utf-8",
          )
          print(f"Updated {changed_files} text files with {replacement_count} replacements")
          PY

      - name: Persist staged rename on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/one-shot-rename-turkish-quality-kit.yml
          git commit -m "refactor: stage TurkishQualityKit rename"
          git push origin HEAD:rename/turkish-quality-kit

      - name: Verify renamed package surface
        run: |
          test -d src/turkishqualitykit
          test ! -e src/turkishevalkit
          grep -q 'name = "turkishqualitykit"' pyproject.toml
          grep -q '^turkishquality = "turkishqualitykit.cli:main"' pyproject.toml

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Run lint and type checks
        run: |
          ruff check .
          mypy src
