name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")
          expected = tag[1:]
          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          actual = metadata["project"]["version"]
          if actual != expected:
              raise SystemExit(
                  f"tag/package version mismatch: tag={expected!r}, package={actual!r}"
              )
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify built wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/turkisheval" rubrics
          "$RUNNER_TEMP/release-venv/bin/turkisheval" evaluate examples/text-evaluation.json --json \
            > "$RUNNER_TEMP/release-smoke.json"
          grep -q '"normalized_score"' "$RUNNER_TEMP/release-smoke.json"

      - name: Write SHA-256 checksums
        run: sha256sum dist/* > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "TurkishEvalKit ${{ github.ref_name }}" \
            --generate-notes
