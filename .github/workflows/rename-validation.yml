name: TurkishQualityKit Rename Validation

on:
  push:
    branches:
      - rename/turkish-quality-kit
    paths:
      - ".github/workflows/rename-validation.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify rename surface
        shell: bash
        run: |
          set -euo pipefail
          git ls-files 'src/turkishevalkit/**' | grep -q . && exit 1 || true
          git ls-files 'src/turkishqualitykit/**' | grep -q .
          grep -q 'name = "turkishqualitykit"' pyproject.toml
          grep -q '^turkishquality = "turkishqualitykit.cli:main"' pyproject.toml
          grep -q '^turkishquality-queue = "turkishqualitykit.review_queue_app:main"' pyproject.toml

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: CLI smoke
        run: |
          turkishquality rubrics
          turkishquality evaluate examples/text-evaluation.json --json > /tmp/text-result.json
          grep -q '"normalized_score"' /tmp/text-result.json

      - name: Wheel smoke
        run: |
          rm -rf /tmp/turkishqualitykit-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/turkishqualitykit-wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path('/tmp/turkishqualitykit-wheel').glob('turkishqualitykit-*.whl'))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert 'turkishqualitykit/__init__.py' in names
          assert 'turkishqualitykit/cli.py' in names
          PY
