name: Review Queue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-queue.yml"
      - "pyproject.toml"
      - "src/turkishqualitykit/cli.py"
      - "src/turkishqualitykit/review_queue.py"
      - "src/turkishqualitykit/review_queue_app.py"
      - "src/turkishqualitykit/templates/review_queue.html"
      - "src/turkishqualitykit/static/review_queue.css"
      - "src/turkishqualitykit/static/review_queue.js"
      - "tests/test_cli_queue.py"
      - "tests/test_review_queue.py"
      - "tests/test_review_queue_app.py"
  pull_request:
    paths:
      - ".github/workflows/review-queue.yml"
      - "pyproject.toml"
      - "src/turkishqualitykit/cli.py"
      - "src/turkishqualitykit/review_queue.py"
      - "src/turkishqualitykit/review_queue_app.py"
      - "src/turkishqualitykit/templates/review_queue.html"
      - "src/turkishqualitykit/static/review_queue.css"
      - "src/turkishqualitykit/static/review_queue.js"
      - "tests/test_cli_queue.py"
      - "tests/test_review_queue.py"
      - "tests/test_review_queue_app.py"

permissions:
  contents: read

concurrency:
  group: review-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  queue-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Queue backend tests
        run: pytest -q tests/test_cli_queue.py tests/test_review_queue.py tests/test_review_queue_app.py

      - name: JavaScript syntax
        run: node --check src/turkishqualitykit/static/review_queue.js

      - name: Console entry points
        run: |
          turkishquality queue --help
          turkishquality-queue --help

      - name: Wheel queue assets
        run: |
          rm -rf /tmp/turkishqualitykit-queue-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/turkishqualitykit-queue-wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("/tmp/turkishqualitykit-queue-wheel").glob("turkishqualitykit-*.whl"))
          required = {
              "turkishqualitykit/templates/review_queue.html",
              "turkishqualitykit/static/review_queue.css",
              "turkishqualitykit/static/review_queue.js",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = required - names
          if missing:
              raise SystemExit(f"missing review queue assets: {sorted(missing)}")
          PY
