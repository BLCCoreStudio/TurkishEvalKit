name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "test/**", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: turkishevalkit-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest --cov=turkishevalkit --cov-report=term-missing --cov-fail-under=90

      - name: Wheel package-data smoke test
        run: |
          rm -rf /tmp/turkishevalkit-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/turkishevalkit-wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("/tmp/turkishevalkit-wheel").glob("turkishevalkit-*.whl"))
          required = {
              "turkishevalkit/templates/workbench.html",
              "turkishevalkit/static/workbench.css",
              "turkishevalkit/static/workbench.js",
              "turkishevalkit/static/audio_annotations.css",
              "turkishevalkit/static/audio_annotations.js",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = required - names
          if missing:
              raise SystemExit(f"missing workbench assets: {sorted(missing)}")
          PY

      - name: CLI smoke test
        run: |
          turkisheval rubrics
          turkisheval evaluate examples/text-evaluation.json --json > /tmp/text-result.json
          turkisheval evaluate examples/audio-evaluation.json --json > /tmp/audio-result.json
          turkisheval evaluate examples/pairwise-evaluation.json --json > /tmp/pairwise-result.json
          grep -q '"normalized_score"' /tmp/text-result.json
          grep -q '"normalized_score"' /tmp/audio-result.json
          grep -q '"audio_annotations"' /tmp/audio-result.json
          grep -q '"start_ms": 1850' /tmp/audio-result.json
          grep -q '"preference_score"' /tmp/pairwise-result.json
          grep -q '"overall_preference": "a"' /tmp/pairwise-result.json

  live-workbench:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKSPACE: /tmp/turkisheval-live
      PORT: "8765"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install workbench
        run: python -m pip install --disable-pip-version-check -e ".[workbench]"

      - name: Start real localhost server
        run: |
          mkdir -p "$WORKSPACE"
          turkisheval workbench --no-browser --workspace "$WORKSPACE" --port "$PORT" \
            > "$RUNNER_TEMP/workbench.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/workbench.pid"

          ready=0
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:$PORT/api/config" \
              > "$RUNNER_TEMP/config.json"; then
              ready=1
              break
            fi
            sleep 0.25
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/workbench.log"
            exit 1
          fi

          ss -ltn | grep -q "127.0.0.1:$PORT"
          if ss -ltn | grep -q "0.0.0.0:$PORT"; then
            echo "workbench unexpectedly bound to all IPv4 interfaces"
            exit 1
          fi

      - name: Exercise real HTTP and persistence flow
        run: |
          curl --fail --silent --show-error "http://127.0.0.1:$PORT/" \
            > "$RUNNER_TEMP/index.html"
          grep -q "TurkishEvalKit" "$RUNNER_TEMP/index.html"
          grep -q "Pairwise" "$RUNNER_TEMP/index.html"
          grep -q "audio_annotations.js" "$RUNNER_TEMP/index.html"

          curl --fail --silent --show-error \
            "http://127.0.0.1:$PORT/static/workbench.css" \
            > "$RUNNER_TEMP/workbench.css"
          curl --fail --silent --show-error \
            "http://127.0.0.1:$PORT/static/workbench.js" \
            > "$RUNNER_TEMP/workbench.js"
          curl --fail --silent --show-error \
            "http://127.0.0.1:$PORT/static/audio_annotations.css" \
            > "$RUNNER_TEMP/audio_annotations.css"
          curl --fail --silent --show-error \
            "http://127.0.0.1:$PORT/static/audio_annotations.js" \
            > "$RUNNER_TEMP/audio_annotations.js"
          test -s "$RUNNER_TEMP/workbench.css"
          test -s "$RUNNER_TEMP/workbench.js"
          test -s "$RUNNER_TEMP/audio_annotations.css"
          test -s "$RUNNER_TEMP/audio_annotations.js"
          node --check "$RUNNER_TEMP/workbench.js"
          node --check "$RUNNER_TEMP/audio_annotations.js"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("examples/text-evaluation.json").read_text(encoding="utf-8"))
          data["workflow_context"] = {
              "session_id": "live-session-001",
              "evaluator_id": "live-evaluator-01",
          }
          Path(os.environ["RUNNER_TEMP"], "text-workflow.json").write_text(
              json.dumps(data, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/text-workflow.json" \
            "http://127.0.0.1:$PORT/api/evaluations" \
            > "$RUNNER_TEMP/text-created.json"

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data-binary @examples/audio-evaluation.json \
            "http://127.0.0.1:$PORT/api/evaluations" \
            > "$RUNNER_TEMP/audio-created.json"

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data-binary @examples/pairwise-evaluation.json \
            "http://127.0.0.1:$PORT/api/evaluations" \
            > "$RUNNER_TEMP/pairwise-created.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          text = json.loads((temp / "text-created.json").read_text())
          assert text["workflow"]["state"] == "draft"
          assert text["workflow"]["session"]["session_id"] == "live-session-001"
          assert text["workflow"]["session"]["evaluator_id"] == "live-evaluator-01"
          (temp / "text-name.txt").write_text(text["filename"])
          PY

          text_name=$(cat "$RUNNER_TEMP/text-name.txt")
          curl --fail --silent --show-error \
            "http://127.0.0.1:$PORT/api/history/$text_name" \
            > "$RUNNER_TEMP/text-before-workflow.json"

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data '{"actor_id":"live-evaluator-01","note":"Ready for review."}' \
            "http://127.0.0.1:$PORT/api/workflows/$text_name/submit" \
            > "$RUNNER_TEMP/text-submitted.json"

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data '{"actor_id":"live-reviewer-01","outcome":"escalate","note":"Factuality evidence requires independent resolution."}' \
            "http://127.0.0.1:$PORT/api/workflows/$text_name/review" \
            > "$RUNNER_TEMP/text-reviewed.json"

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data '{"actor_id":"live-adjudicator-01","outcome":"review_concern_upheld","note":"Independent evidence confirms the reviewer concern."}' \
            "http://127.0.0.1:$PORT/api/workflows/$text_name/adjudicate" \
            > "$RUNNER_TEMP/text-adjudicated.json"

          curl --fail --silent --show-error \
            "http://127.0.0.1:$PORT/api/history/$text_name/details" \
            > "$RUNNER_TEMP/text-details.json"
          curl --fail --silent --show-error \
            "http://127.0.0.1:$PORT/api/history/$text_name" \
            > "$RUNNER_TEMP/text-after-workflow.json"
          cmp "$RUNNER_TEMP/text-before-workflow.json" "$RUNNER_TEMP/text-after-workflow.json"

          curl --fail --silent --show-error \
            "http://127.0.0.1:$PORT/api/history" \
            > "$RUNNER_TEMP/history.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          workspace = Path(os.environ["WORKSPACE"])

          text = json.loads((temp / "text-created.json").read_text())
          audio = json.loads((temp / "audio-created.json").read_text())
          pairwise = json.loads((temp / "pairwise-created.json").read_text())
          submitted = json.loads((temp / "text-submitted.json").read_text())["workflow"]
          reviewed = json.loads((temp / "text-reviewed.json").read_text())["workflow"]
          adjudicated = json.loads((temp / "text-adjudicated.json").read_text())["workflow"]
          details = json.loads((temp / "text-details.json").read_text())
          history = json.loads((temp / "history.json").read_text())["items"]

          assert text["result"]["task_id"] == "text-demo-001"
          assert text["result"]["normalized_score"] == 95.0
          assert submitted["state"] == "submitted"
          assert reviewed["state"] == "reviewed"
          assert reviewed["events"][-1]["review_outcome"] == "escalate"
          assert adjudicated["state"] == "adjudicated"
          assert adjudicated["events"][-1]["adjudication_outcome"] == "review_concern_upheld"
          assert [event["sequence"] for event in adjudicated["events"]] == [1, 2, 3, 4]
          assert details["evaluation"]["task_id"] == "text-demo-001"
          assert details["workflow"]["state"] == "adjudicated"

          assert audio["result"]["task_id"] == "audio-demo-001"
          annotations = audio["result"]["payload"]["audio_annotations"]
          assert len(annotations) == 2
          assert annotations[0]["start_ms"] == 1850
          assert annotations[0]["end_ms"] == 2550
          assert annotations[0]["category"] == "emphasis"
          assert annotations[1]["start_ms"] == annotations[1]["end_ms"] == 5100
          assert annotations[1]["category"] == "intonation"
          assert pairwise["result"]["task_id"] == "pairwise-demo-001"
          assert pairwise["result"]["overall_preference"] == "a"
          assert pairwise["result"]["preference_score"] == 40.0
          assert len(history) == 3
          assert {item["evaluation_type"] for item in history} == {"text", "audio", "pairwise"}

          by_task = {item["task_id"]: item for item in history}
          assert by_task["text-demo-001"]["workflow_state"] == "adjudicated"
          assert by_task["text-demo-001"]["review_outcome"] == "escalate"
          assert by_task["text-demo-001"]["adjudication_outcome"] == "review_concern_upheld"
          assert by_task["pairwise-demo-001"]["overall_preference"] == "a"
          assert by_task["pairwise-demo-001"]["preference_score"] == 40.0

          persisted = list((workspace / "evaluations").glob("*.json"))
          workflows = list((workspace / "workflows").glob("*.workflow.json"))
          assert len(persisted) == 3
          assert len(workflows) == 1

          (temp / "export-name.txt").write_text(by_task["pairwise-demo-001"]["filename"])
          PY

          export_name=$(cat "$RUNNER_TEMP/export-name.txt")
          curl --fail --silent --show-error \
            "http://127.0.0.1:$PORT/api/history/$export_name" \
            > "$RUNNER_TEMP/exported.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "exported.json").read_text())
          assert payload["task_id"] == "pairwise-demo-001"
          assert payload["preference_score"] == 40.0
          assert payload["payload"]["source"]["response_a"]
          assert payload["payload"]["source"]["response_b"]
          PY

      - name: Stop workbench
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/workbench.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/workbench.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/workbench.log" 2>/dev/null || true

  browser-e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKSPACE: /tmp/turkisheval-browser-workspace
      PORT: "8766"
      WORKBENCH_URL: http://127.0.0.1:8766
      E2E_ARTIFACTS: /tmp/turkisheval-browser-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install workbench
        run: python -m pip install --disable-pip-version-check -e ".[workbench]"

      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start workbench for browser test
        run: |
          rm -rf "$WORKSPACE" "$E2E_ARTIFACTS"
          mkdir -p "$WORKSPACE" "$E2E_ARTIFACTS"
          turkisheval workbench --no-browser --workspace "$WORKSPACE" --port "$PORT" \
            > "$RUNNER_TEMP/browser-workbench.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/browser-workbench.pid"

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent "$WORKBENCH_URL/api/config" > /dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/browser-workbench.log"
            exit 1
          fi

      - name: Exercise desktop and mobile browser flows
        run: node tests/e2e/workbench.mjs

      - name: Verify browser artifacts and persisted records
        run: |
          test -s "$E2E_ARTIFACTS/desktop.png"
          test -s "$E2E_ARTIFACTS/mobile.png"
          test "$(find "$WORKSPACE/evaluations" -type f -name '*.json' | wc -l)" -eq 4
          test "$(find "$WORKSPACE/workflows" -type f -name '*.workflow.json' | wc -l)" -eq 4
          ls -lh "$E2E_ARTIFACTS"

      - name: Stop browser test workbench
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/browser-workbench.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/browser-workbench.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/browser-workbench.log" 2>/dev/null || true
