name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "chore/**", "test/**", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: turkishevalkit-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest --cov=turkishevalkit --cov-report=term-missing --cov-fail-under=90

      - name: Wheel package-data smoke test
        run: |
          rm -rf /tmp/turkishevalkit-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/turkishevalkit-wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("/tmp/turkishevalkit-wheel").glob("turkishevalkit-*.whl"))
          required = {
              "turkishevalkit/templates/workbench.html",
              "turkishevalkit/static/workbench.css",
              "turkishevalkit/static/workbench.js",
              "turkishevalkit/static/audio_annotations.css",
              "turkishevalkit/static/audio_annotations.js",
              "turkishevalkit/templates/calibration.html",
              "turkishevalkit/static/calibration.css",
              "turkishevalkit/static/calibration.js",
              "turkishevalkit/static/navigation.css",
              "turkishevalkit/templates/reliability.html",
              "turkishevalkit/static/reliability.css",
              "turkishevalkit/static/reliability.js",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = required - names
          if missing:
              raise SystemExit(f"missing packaged workbench assets: {sorted(missing)}")
          PY

      - name: CLI smoke test
        run: |
          turkisheval rubrics > /tmp/rubrics.txt
          turkisheval evaluate examples/text-evaluation.json > /tmp/evaluation.txt
          turkisheval calibrate examples/calibration-text.json > /tmp/calibration.txt
          turkisheval reliability examples/reliability-text.json > /tmp/reliability.txt
          turkisheval convert examples/text-evaluation.json /tmp/interchange.json
          turkisheval index status --workspace /tmp/turkisheval-index-workspace > /tmp/index-status.txt
          python -m turkishevalkit --help > /tmp/help.txt
          grep -q "tr-text-quality" /tmp/rubrics.txt
          grep -q "95.00" /tmp/evaluation.txt
          grep -q "Exact criterion agreement" /tmp/calibration.txt
          grep -q "Krippendorff" /tmp/reliability.txt
          grep -q '"schema": "turkishevalkit.evaluation-dataset"' /tmp/interchange.json
          grep -q "State: absent" /tmp/index-status.txt
          grep -q "workbench" /tmp/help.txt

  live-workbench:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install workbench
        run: python -m pip install --disable-pip-version-check -e ".[workbench]"

      - name: Start real localhost server
        run: |
          rm -rf /tmp/turkisheval-live-workspace
          turkisheval workbench \
            --workspace /tmp/turkisheval-live-workspace \
            --port 8766 \
            --no-browser \
            > /tmp/turkisheval-workbench.log 2>&1 &
          echo $! > /tmp/turkisheval-workbench.pid
          ready=0
          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8766/api/config > /tmp/config.json; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/turkisheval-workbench.log
            exit 1
          fi

      - name: Exercise real HTTP and persistence flow
        run: |
          curl --fail --silent http://127.0.0.1:8766/ > /tmp/workbench.html
          curl --fail --silent http://127.0.0.1:8766/calibration > /tmp/calibration.html
          curl --fail --silent http://127.0.0.1:8766/reliability > /tmp/reliability.html
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            --data-binary @examples/text-evaluation.json \
            http://127.0.0.1:8766/api/evaluations > /tmp/saved.json
          curl --fail --silent http://127.0.0.1:8766/api/history > /tmp/history.json
          curl --fail --silent http://127.0.0.1:8766/api/reliability/candidates > /tmp/reliability-candidates.json
          python - <<'PY'
          import json
          from pathlib import Path

          saved = json.loads(Path('/tmp/saved.json').read_text())
          history = json.loads(Path('/tmp/history.json').read_text())
          candidates = json.loads(Path('/tmp/reliability-candidates.json').read_text())
          assert saved['result']['task_id'] == 'text-demo-001'
          assert len(history['items']) == 1
          assert history['items'][0]['filename'] == saved['filename']
          assert candidates['minimum_task_count_floor'] == 3
          assert len(candidates['groups']) == 1
          assert candidates['groups'][0]['ready'] is False
          files = list(Path('/tmp/turkisheval-live-workspace/evaluations').glob('*.json'))
          assert len(files) == 1
          PY
          grep -q "TurkishEvalKit" /tmp/workbench.html
          grep -q "Multi-evaluator calibration" /tmp/calibration.html
          grep -q "Population reliability workspace" /tmp/reliability.html

      - name: Stop workbench
        if: always()
        run: |
          if [ -f /tmp/turkisheval-workbench.pid ]; then
            kill "$(cat /tmp/turkisheval-workbench.pid)" 2>/dev/null || true
          fi
          cat /tmp/turkisheval-workbench.log 2>/dev/null || true

  browser-e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKSPACE: /tmp/turkisheval-browser-workspace
      PORT: "8767"
      WORKBENCH_URL: http://127.0.0.1:8767
      E2E_ARTIFACTS: /tmp/turkisheval-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install workbench
        run: python -m pip install --disable-pip-version-check -e ".[workbench]"

      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start workbench for browser test
        run: |
          rm -rf "$WORKSPACE" "$E2E_ARTIFACTS"
          mkdir -p "$E2E_ARTIFACTS"
          turkisheval workbench \
            --workspace "$WORKSPACE" \
            --port "$PORT" \
            --no-browser \
            > "$RUNNER_TEMP/workbench.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/workbench.pid"

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent "$WORKBENCH_URL/api/config" > /dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/workbench.log"
            exit 1
          fi

      - name: Exercise desktop and mobile browser flows
        run: node tests/e2e/workbench.mjs

      - name: Verify browser artifacts and persisted records
        run: |
          test -s "$E2E_ARTIFACTS/desktop-workbench.png"
          test -s "$E2E_ARTIFACTS/mobile-workbench.png"
          test "$(find "$WORKSPACE/evaluations" -type f -name '*.json' | wc -l)" -eq 4
          test "$(find "$WORKSPACE/workflows" -type f -name '*.workflow.json' | wc -l)" -eq 4
          test "$(find "$WORKSPACE/revisions" -type f -name '*.revision.json' | wc -l)" -eq 1
          ls -lh "$E2E_ARTIFACTS"

      - name: Stop browser test workbench
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/workbench.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/workbench.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/workbench.log" 2>/dev/null || true
