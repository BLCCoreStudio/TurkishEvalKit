name: Disagreement Explorer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/disagreement-explorer.yml"
      - "pyproject.toml"
      - "src/turkishqualitykit/__init__.py"
      - "src/turkishqualitykit/disagreement.py"
      - "src/turkishqualitykit/calibration_dashboard.py"
      - "src/turkishqualitykit/templates/calibration.html"
      - "src/turkishqualitykit/static/calibration.css"
      - "src/turkishqualitykit/static/calibration.js"
      - "tests/test_disagreement.py"
      - "tests/test_disagreement_dashboard.py"
  pull_request:
    paths:
      - ".github/workflows/disagreement-explorer.yml"
      - "pyproject.toml"
      - "src/turkishqualitykit/__init__.py"
      - "src/turkishqualitykit/disagreement.py"
      - "src/turkishqualitykit/calibration_dashboard.py"
      - "src/turkishqualitykit/templates/calibration.html"
      - "src/turkishqualitykit/static/calibration.css"
      - "src/turkishqualitykit/static/calibration.js"
      - "tests/test_disagreement.py"
      - "tests/test_disagreement_dashboard.py"

permissions:
  contents: read

concurrency:
  group: disagreement-explorer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explorer-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Explorer tests
        run: pytest -q tests/test_disagreement.py tests/test_disagreement_dashboard.py

      - name: JavaScript syntax
        run: node --check src/turkishqualitykit/static/calibration.js

      - name: Public API smoke
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import turkishqualitykit
          from turkishqualitykit import build_disagreement_report

          assert turkishqualitykit.__version__ == version("turkishqualitykit")
          assert callable(build_disagreement_report)
          PY

      - name: Wheel explorer assets
        run: |
          rm -rf /tmp/turkishqualitykit-disagreement-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/turkishqualitykit-disagreement-wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(
              Path("/tmp/turkishqualitykit-disagreement-wheel").glob("turkishqualitykit-*.whl")
          )
          required = {
              "turkishqualitykit/disagreement.py",
              "turkishqualitykit/templates/calibration.html",
              "turkishqualitykit/static/calibration.css",
              "turkishqualitykit/static/calibration.js",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = required - names
          if missing:
              raise SystemExit(f"missing disagreement explorer assets: {sorted(missing)}")
          PY
